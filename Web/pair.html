<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Muskey</title>
<!-- app -->
<style>
:root {
    color-scheme: light dark;
    --ink: rgb(33 20 26);
    --muted: rgb(74 51 61 / 0.8);
    --surface: rgb(255 253 251);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root { --ink: rgb(255 247 245); --muted: rgb(232 217 219 / 0.75); --surface: rgb(17 15 16); }
}
body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-content: center;
    gap: 8px;
    padding: 24px 16px;
    box-sizing: border-box;
    text-align: center;
    color: var(--ink);
    background: var(--surface);
}
h1 { margin: 0; font-size: 28px; }
p { margin: 0; color: var(--muted); font-size: 15px; max-width: 30ch; }
</style>
</head>
<body>
<h1>Muskey</h1>
<p>Open the pairing link from Muskey's Settings &gt; Remote on this device</p>
</body>
</html>
