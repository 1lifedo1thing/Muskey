<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Muskey">
<meta name="theme-color" content="rgb(250 244 240)" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="rgb(17 15 16)" media="(prefers-color-scheme: dark)">
<meta name="generator" content="Muskey">
<title>Muskey</title>
<link rel="stylesheet" href="/web/sheet.css">
<link rel="stylesheet" href="/web/remote.css">
</head>
<body>

<div class="view" id="home">
    <header class="large-title"><h1>Muskey</h1></header>

    <section class="section">
        <div class="label">Now playing</div>
        <div class="card">
            <button class="row song-row" id="now" disabled>
                <img class="cover" id="now-cover" alt="">
                <div class="grow">
                    <div class="song-title" id="now-title">Nothing playing</div>
                    <div class="song-artist" id="now-artist"></div>
                    <div class="pills" id="now-pills"></div>
                </div>
                <span class="icon chevron" id="now-chevron" hidden></span>
            </button>
            <label class="row" hidden>
                <span class="icon" style="--symbol: url(/api/symbol/speaker.wave.2.fill)"></span>
                <span class="grow row-label">Mac sound</span>
                <span class="switch"><input type="checkbox" class="mac-sound" role="switch" aria-label="Mac sound"><span></span></span>
            </label>
        </div>
    </section>

    <section class="section">
        <div class="label">Spotify</div>
        <form class="card row" id="spotify-form">
            <input class="field" id="spotify-link" type="url" inputmode="url" placeholder="Spotify link" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Spotify link">
            <button class="button primary" id="spotify-play" type="submit">Play</button>
        </form>
        <div class="status" id="spotify-status"></div>
    </section>

    <section class="section">
        <div class="label">Recent songs</div>
        <div class="card" id="songs"></div>
    </section>
</div>

<div class="view" id="song" hidden>
    <header class="top">
        <button class="close" id="close">Close song</button>
        <div class="title" id="bar-title"></div>
        <div class="spacer"></div>
    </header>

    <div class="head">
        <img class="cover large" id="song-cover" alt="">
        <div class="grow" style="min-width: 0">
            <div class="song-title" id="song-title"></div>
            <div class="song-artist" id="song-artist"></div>
            <div class="pills" id="song-pills"></div>
        </div>
    </div>

    <section class="section">
        <div class="label">Key <span class="pill honey" id="change-pill" hidden></span></div>
        <div class="keyrow" id="keyrow">
            <button class="step down" id="key-down" aria-label="Semitone down"><span class="icon" style="--symbol: url(/api/symbol/chevron.left)"></span></button>
            <div class="keys" id="keys" role="group" aria-label="Key"></div>
            <button class="step up" id="key-up" aria-label="Semitone up"><span class="icon" style="--symbol: url(/api/symbol/chevron.right)"></span></button>
        </div>
    </section>

    <section class="section">
        <div class="card">
            <div class="row">
                <span class="row-label">Tempo</span>
                <span class="grow"><span class="pill" id="bpm-pill" hidden></span></span>
                <div class="stepper">
                    <button class="down" id="speed-down" aria-label="Slower"><span class="icon" style="--symbol: url(/api/symbol/chevron.left)"></span></button>
                    <button class="value" id="speed-value" aria-label="Play at the song's tempo">100%</button>
                    <button class="up" id="speed-up" aria-label="Faster"><span class="icon" style="--symbol: url(/api/symbol/chevron.right)"></span></button>
                </div>
            </div>
            <div class="row" id="part-row">
                <span class="row-label grow">Part</span>
                <input class="time" id="from" inputmode="decimal" placeholder="Start" autocomplete="off" aria-label="From">
                <input class="time" id="to" inputmode="decimal" placeholder="End" autocomplete="off" aria-label="To">
            </div>
        </div>
    </section>

    <section class="section">
        <div class="label">Instruments <button class="small-button" id="play-all" hidden>Play all</button></div>
        <div class="card padded"><div class="stems" id="stems" role="group" aria-label="Instruments"></div></div>
    </section>

    <section class="section" id="notes-section">
        <div class="label">Notes</div>
        <div class="card padded">
            <div class="segments" id="notes-stem" role="group" aria-label="Instrument to transcribe"></div>
            <button class="button big" id="transcribe" style="width: 100%; margin-top: 10px">Transcribe</button>
            <div class="status" id="notes-status"></div>
        </div>
        <div id="sheet" hidden></div>
    </section>

    <footer class="dock">
        <div class="status" id="status" aria-live="polite"></div>
        <div class="bar-progress" id="progress" hidden><div></div></div>
        <div class="player" id="player" hidden>
            <button class="play" id="play-pause" aria-label="Play"><span class="icon" id="play-icon" style="--symbol: url(/api/symbol/play.fill)"></span></button>
            <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
            <span class="clock" id="clock">0:00 / 0:00</span>
        </div>
        <div class="actions" id="file-actions">
            <button class="button big" id="play-mac"><span class="icon" style="--symbol: url(/api/symbol/macbook)"></span><span>Play on Mac</span></button>
            <button class="button big primary" id="listen"><span class="icon" style="--symbol: url(/api/symbol/headphones)"></span><span>Listen Here</span></button>
        </div>
        <label class="row" id="live-sound" style="min-height: 44px; padding: 0 4px" hidden>
            <span class="icon" style="--symbol: url(/api/symbol/speaker.wave.2.fill)"></span>
            <span class="grow row-label">Mac sound</span>
            <span class="switch"><input type="checkbox" class="mac-sound" role="switch" aria-label="Mac sound"><span></span></span>
        </label>
    </footer>
    <audio id="audio" preload="auto"></audio>
</div>

<script src="/web/sheet.js"></script>
<script src="/web/remote.js"></script>
</body>
</html>
