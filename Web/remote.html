<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Muskey">
<meta name="theme-color" content="rgb(250 244 240)" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="rgb(17 15 16)" media="(prefers-color-scheme: dark)">
<meta name="generator" content="Muskey">
<!-- app -->
<title>Muskey</title>
<link rel="stylesheet" href="/web/sheet.css">
<link rel="stylesheet" href="/web/remote.css">
</head>
<body>

<div class="view" id="home">
    <header class="large-title">
        <h1>Muskey</h1>
        <div class="title-side">
            <div class="mac" id="mac" hidden><span class="dot"></span><span id="mac-name"></span></div>
            <button class="gear" id="settings-open" aria-label="Settings"><span class="icon" style="--symbol: url(/api/symbol/gearshape)"></span></button>
        </div>
    </header>

    <section class="section">
        <div class="label">Now playing</div>
        <div class="card" id="now-card">
            <button class="row song-row" id="now" disabled>
                <span id="now-cover"></span>
                <div class="grow">
                    <div class="song-title" id="now-title">Nothing playing</div>
                    <div class="song-artist" id="now-artist"></div>
                    <div class="pills" id="now-pills"></div>
                </div>
                <span class="icon chevron" id="now-chevron" hidden></span>
            </button>
        </div>
    </section>

    <section class="section">
        <div class="label">Open</div>
        <div class="card">
            <form class="row" id="link-form" novalidate>
                <textarea class="field link-field" id="link" rows="2" inputmode="url" enterkeyhint="go" placeholder="Paste a link to a Spotify song, YouTube video, etc." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Link"></textarea>
                <button class="button primary" id="link-play" type="submit"><span class="label-text">Play</span></button>
            </form>
            <button class="row open-row" id="upload"><span class="icon" style="--symbol: url(/api/symbol/iphone)"></span><span class="grow label-text">Open a file from this phone</span><span class="icon chevron"></span></button>
            <button class="row open-row" id="mac-files"><span class="icon" style="--symbol: url(/api/symbol/macbook)"></span><span class="grow">Open a file from the Mac</span><span class="icon chevron"></span></button>
        </div>
        <input type="file" id="upload-file" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.aif,.aiff,.flac,.ogg,.opus,.mp4,.mov,.mkv,.webm" hidden>
        <div class="error-line" id="open-error" hidden></div>
    </section>

    <section class="section">
        <div class="label">Recent songs</div>
        <div class="card" id="songs"></div>
    </section>
</div>

<div class="view" id="files" hidden>
    <header class="files-top">
        <div class="files-bar">
            <button class="back" id="files-close" aria-label="Close files"><span class="icon" style="--symbol: url(/api/symbol/chevron.left)"></span></button>
            <h2 id="files-title">Files on the Mac</h2>
            <div class="spacer"></div>
        </div>
        <input class="field" id="files-search" type="search" placeholder="Search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search">
    </header>
    <div id="files-list"></div>
    <div class="empty" id="files-more" hidden>Search to find more</div>
    <nav class="letters" id="files-letters" aria-label="Letters" hidden></nav>
</div>

<div class="view" id="song" hidden>
    <header class="top" id="top" aria-hidden="true">
        <button class="back" id="top-close" aria-label="Close song" tabindex="-1"><span class="icon" style="--symbol: url(/api/symbol/chevron.left)"></span></button>
        <div class="title" id="bar-title"></div>
        <div class="spacer"></div>
    </header>

    <div class="head" id="head">
        <button class="back" id="close" aria-label="Close song"><span class="icon" style="--symbol: url(/api/symbol/chevron.left)"></span></button>
        <span class="cover-wrap" id="cover-wrap"><span id="song-cover"></span><span class="source-badge" id="source-badge" hidden></span></span>
        <div class="grow" style="min-width: 0">
            <div class="song-title" id="song-title"></div>
            <div class="song-artist" id="song-artist"></div>
        </div>
        <button class="button compact" id="save" hidden><span class="icon" style="--symbol: url(/api/symbol/square.and.arrow.down)"></span><span class="label-text">Save</span></button>
        <a class="button compact primary" id="save-link" hidden><span class="icon" style="--symbol: url(/api/symbol/square.and.arrow.down)"></span><span class="label-text">Download</span></a>
    </div>
    <div class="error-line" id="save-error" hidden></div>

    <section class="section">
        <div class="label">Key <span class="label-side"><button class="reset" id="key-reset" aria-label="Reset key" hidden><span class="icon" style="--symbol: url(/api/symbol/arrow.counterclockwise)"></span></button><span class="pill" id="change-pill" hidden></span></span></div>
        <div class="keyrow" id="keyrow">
            <button class="step down" id="key-down" aria-label="Semitone down"><span class="icon" style="--symbol: url(/api/symbol/chevron.left)"></span></button>
            <div class="keys" id="keys" role="group" aria-label="Key"></div>
            <button class="step up" id="key-up" aria-label="Semitone up"><span class="icon" style="--symbol: url(/api/symbol/chevron.right)"></span></button>
        </div>
    </section>

    <section class="section">
        <div class="card">
            <div class="row">
                <span class="row-label">Tempo</span>
                <span class="grow label-side"><button class="reset" id="speed-reset" aria-label="Reset tempo" hidden><span class="icon" style="--symbol: url(/api/symbol/arrow.counterclockwise)"></span></button><span class="pill" id="bpm-pill" hidden></span></span>
                <div class="stepper">
                    <button class="down" id="speed-down" aria-label="Slower"><span class="icon" style="--symbol: url(/api/symbol/minus)"></span></button>
                    <button class="value" id="speed-value" aria-label="Play at the song's tempo">100%</button>
                    <button class="up" id="speed-up" aria-label="Faster"><span class="icon" style="--symbol: url(/api/symbol/plus)"></span></button>
                </div>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="label">Instruments <button class="small-button" id="play-all" hidden>Play all</button></div>
        <div class="card padded"><div class="stems" id="stems" role="group" aria-label="Instruments"></div></div>
    </section>

    <section class="section" id="notes-section">
        <div class="label">Notes</div>
        <div class="card padded">
            <div class="segments" id="notes-stem" role="group" aria-label="Instrument to transcribe"></div>
            <button class="button big" id="transcribe" style="width: 100%; margin-top: 10px">Transcribe</button>
            <div class="error-line" id="notes-error" hidden></div>
        </div>
        <div id="sheet" hidden></div>
    </section>

    <footer class="dock">
        <div class="error-line" id="song-error" hidden></div>
        <div class="transport" id="transport">
            <div class="wave" id="wave" aria-label="Position and region loop">
                <canvas id="wave-canvas"></canvas>
                <div class="wave-selection" id="wave-selection" hidden></div>
                <div class="playhead" id="playhead"></div>
                <button class="loop-end" id="end-start" data-end="start" aria-label="Loop start" hidden><span class="tab">A</span></button>
                <button class="loop-end" id="end-end" data-end="end" aria-label="Loop end" hidden><span class="tab">B</span></button>
            </div>
            <button class="zoom-map" id="zoom-map" aria-label="Zoom out"><span class="zoom-window" id="zoom-window"></span></button>
            <div class="clocks">
                <span class="clock" id="mac-elapsed">0:00</span>
                <span class="loop-time" id="loop-time"></span>
                <span class="clock" id="mac-left">0:00</span>
            </div>
            <div class="transport-buttons">
                <button class="round side" id="loop-button" aria-label="Start loop"><span class="icon" style="--symbol: url(/api/symbol/repeat)"></span></button>
                <button class="round" id="mac-back" aria-label="Back 5 seconds"><span class="icon" id="back-icon" style="--symbol: url(/api/symbol/gobackward.5)"></span></button>
                <button class="play" id="mac-play" aria-label="Play"><span class="icon" id="mac-play-icon" style="--symbol: url(/api/symbol/play.fill)"></span></button>
                <button class="round" id="mac-forward" aria-label="Forward 5 seconds"><span class="icon" id="forward-icon" style="--symbol: url(/api/symbol/goforward.5)"></span></button>
                <button class="round side" id="output-button" aria-label="Output: Mac" aria-haspopup="menu" aria-expanded="false"><span class="icon" id="output-icon" style="--symbol: url(/api/symbol/macbook)"></span></button>
            </div>
        </div>
        <div class="menu" id="output-menu" role="menu" aria-label="Output" hidden>
            <div class="menu-title">Output</div>
            <button role="menuitemradio" id="out-mac" aria-checked="true"><span class="icon" style="--symbol: url(/api/symbol/macbook)"></span><span class="grow">Mac</span><span class="icon check" style="--symbol: url(/api/symbol/checkmark)"></span></button>
            <button role="menuitemradio" id="out-phone" aria-checked="false"><span class="icon" style="--symbol: url(/api/symbol/iphone)"></span><span class="grow">This phone</span><span class="icon check" style="--symbol: url(/api/symbol/checkmark)"></span></button>
        </div>
    </footer>
</div>

<script src="/web/sheet.js"></script>
<!-- Settings of this phone, from the gear on Home. -->
<div class="settings" id="settings" hidden>
    <div class="settings-sheet" role="dialog" aria-label="Settings">
        <div class="settings-head">
            <h2>Settings</h2>
            <button class="install-pill-close" id="settings-close" aria-label="Close settings"><span class="icon" style="--symbol: url(/api/symbol/xmark)"></span></button>
        </div>
        <div class="settings-label">Phone stream</div>
        <div class="card padded">
            <div class="sort stream-choice" id="stream-choice" role="group" aria-label="Phone stream">
                <button data-stream="compressed">Compressed</button>
                <button data-stream="uncompressed">Uncompressed</button>
            </div>
            <div class="stream-note" id="stream-note"></div>
        </div>
        <div class="stream-https" id="stream-https" hidden>Compressed plays without a delay at the HTTPS link</div>
    </div>
</div>

<!-- Install Muskey: a pill floating at the bottom of Home, as on legume. -->
<div class="install-pill" id="install" hidden role="region" aria-label="Install Muskey">
    <div class="install-pill-inner">
        <img class="install-pill-icon" src="/icon-192.png" alt="" width="38" height="38">
        <div class="install-pill-text">
            <span class="install-pill-title">Install Muskey</span>
            <span class="install-pill-hint" id="install-share" hidden>Tap <span class="icon" style="--symbol: url(/api/symbol/square.and.arrow.up)" aria-label="Share"></span> then <strong>Add to Home Screen</strong></span>
            <span class="install-pill-hint" id="install-menu" hidden>Tap <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-label="Menu"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg> then <strong>Add to Home Screen</strong></span>
        </div>
        <button class="install-pill-button" id="install-button" hidden>Install</button>
        <button class="install-pill-close" id="install-hide" aria-label="Hide"><span class="icon" style="--symbol: url(/api/symbol/xmark)"></span></button>
    </div>
</div>

<script src="/web/remote.js"></script>
</body>
</html>
